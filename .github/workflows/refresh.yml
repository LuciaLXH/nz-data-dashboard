name: refresh

on:
  schedule:
    # cron times are UTC. Flow telemetry refreshes every 6 h; population and
    # water quality are monthly — sources are annual, a daily check would be
    # performative.
    - cron: "0 */6 * * *"     # flow / level
    - cron: "0 3 1 * *"       # population + water quality (1st of month)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/**"]

# deploy-pages needs write permissions on pages + a short-lived id token
permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; cancel a running refresh when a new one starts
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch, transform, validate
        run: make data
        env:
          STATS_NZ_API_KEY: ${{ secrets.STATS_NZ_API_KEY }}
      - name: Run tests (schema, units, regions, DST, missing values, percentile)
        run: make test
      - name: Build static site (copies data/processed + data/ref → site/data)
        run: make site-data
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
