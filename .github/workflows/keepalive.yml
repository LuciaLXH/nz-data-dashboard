name: keepalive
# GitHub disables scheduled workflows in public repos after 60 days without
# commits (issues/stars don't count). This empty commit keeps the cron alive.
on:
  schedule:
    - cron: "0 0 1 * *"   # 1st of each month
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive $(date -u +%F)" || true
          git push
